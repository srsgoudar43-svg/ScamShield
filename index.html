  <!-- React 18 & Babel Standalone for Single-File React Execution -->

  <style>
    body {
      background-color: #050814;
      color: #E2E8F0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .cyber-grid {
      background-image: 
        radial-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px),
        radial-gradient(rgba(59, 130, 246, 0.05) 1px, #050814 1px);
      background-size: 32px 32px, 32px 32px;
      background-position: 0 0, 16px 16px;
    }
    .glow-cyan {
      box-shadow: 0 0 25px -4px rgba(0, 240, 255, 0.35);
    }
    .glow-cyan-sm {
      box-shadow: 0 0 12px -2px rgba(0, 240, 255, 0.25);
    }
    .glow-red {
      box-shadow: 0 0 25px -4px rgba(239, 68, 68, 0.35);

    .glass-panel {

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(59, 130, 246, 0.18);

    .glass-panel-cyan {
      background: rgba(11, 17, 32, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.28);
    }
    @keyframes radar-sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-radar {
      animation: radar-sweep 2.5s linear infinite;
      transform-origin: center;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #050814; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-[#050814] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">

  <!-- Single-File React Application Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Inline Cybersecurity Icons (Zero-dependency SVG) ---
    const IconShield = ({ className = "w-6 h-6 text-cyan-400" }) => (

        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
      </svg>
    );

    // --- Indian Telecom Circles & Pre-seeded Dataset ---
    const CIRCLES = ['Delhi NCR', 'Mumbai', 'Maharashtra & Goa', 'Karnataka', 'Tamil Nadu', 'UP West', 'West Bengal', 'Gujarat'];
    const CARRIERS = ['Reliance Jio', 'Bharti Airtel', 'Vodafone Idea (Vi)', 'BSNL Mobile'];

    const INITIAL_RECORDS = [
      {
        phoneNumber: '9876543210',
        formattedNumber: '+91 98765 43210',
        carrier: 'Bharti Airtel',
        circle: 'Delhi NCR',
        riskScore: 96,
        riskLevel: 'CRITICAL',
        categoryName: 'Digital Arrest / Police Impersonation',
        callerName: 'Claimed: CBI Cyber Cell New Delhi',
        reportCount: 142,
        monetaryLossReported: true,
        reasons: [
          'Over 140 community complaints within 72 hours.',
          'Caller demands continuous video interrogation and threatens arrest over drug parcel.',
          'Coerces victims into liquidating savings into fake RBI verification escrow accounts.'
        ],
        reports: [
          { reportedAt: '15m ago', caller: 'Inspector Vikram Rathore (CBI)', location: 'New Delhi', desc: 'Received WhatsApp video call. Person in police uniform claimed a FedEx parcel under my Aadhaar had narcotics. Demanded money transfer.' }
        ]
      },
      {
        phoneNumber: '9123456789',
        formattedNumber: '+91 91234 56789',
        carrier: 'Reliance Jio',
        circle: 'Maharashtra & Goa',
        riskScore: 92,
        riskLevel: 'CRITICAL',
        categoryName: 'Fake Bank KYC / Account Expiry',
        callerName: 'Claimed: SBI YONO Helpdesk',
        reportCount: 89,
        monetaryLossReported: true,
        reasons: [
          'Spamming SMS with malicious APK links claiming YONO account deactivation.',
          'Directs users to fake net banking clone portals.'
        ],
        reports: [
          { reportedAt: '45m ago', caller: 'SBI Support', location: 'Mumbai', desc: 'SMS said my YONO account will be locked today. Asked to install an APK file from link.' }
        ]
      },
      {
        phoneNumber: '8899011223',
        formattedNumber: '+91 88990 11223',
        carrier: 'Vodafone Idea (Vi)',
        circle: 'Uttar Pradesh (West)',
        riskScore: 88,
        riskLevel: 'HIGH',
        categoryName: 'Electricity Bill Disconnection Alert',
        callerName: 'Claimed: State Electricity Officer',
        reportCount: 64,
        monetaryLossReported: false,
        reasons: [
          'Bulk SMS campaign warning power will be disconnected at 9:30 PM.',
          'Asks users to pay token fees via private mobile number.'
        ],
        reports: [
          { reportedAt: '1h ago', caller: 'Electricity Officer RK Verma', location: 'Lucknow', desc: 'Threatened to cut my power tonight unless I called this number.' }
        ]
      },
      {
        phoneNumber: '9820012345',
        formattedNumber: '+91 98200 12345',
        carrier: 'Bharti Airtel',
        circle: 'Mumbai',
        riskScore: 8,
        riskLevel: 'SAFE',
        categoryName: 'Clean / Legitimate Line',
        callerName: 'Standard Subscriber Line',
        reportCount: 0,
        monetaryLossReported: false,
        reasons: ['Zero fraud complaints on record.', 'Normal subscriber routing.'],
        reports: []
      }
    ];

    const PRESETS = [
      { label: 'CBI Digital Arrest', num: '9876543210', badge: 'Critical' },
      { label: 'Fake SBI KYC', num: '9123456789', badge: 'Critical' },
      { label: 'Power Cut SMS', num: '8899011223', badge: 'High' },
      { label: 'Legitimate Caller', num: '9820012345', badge: 'Safe' }
    ];

    function validateIndianNumber(input = '') {
      let digits = String(input).replace(/\D/g, '');
      if (digits.length === 12 && digits.startsWith('91')) digits = digits.slice(2);
      if (digits.length === 11 && digits.startsWith('0')) digits = digits.slice(1);
      if (!digits) return { isValid: false, error: 'Please enter a 10-digit number.' };
      if (digits.length !== 10) return { isValid: false, error: `Indian numbers must be 10 digits (got ${digits.length}).` };
      if (!/^[6-9]/.test(digits)) return { isValid: false, error: 'Indian mobile numbers must start with 6, 7, 8, or 9.' };
      return {
        isValid: true,
        digits,
        formatted: `+91 ${digits.slice(0, 5)} ${digits.slice(5)}`,
        carrier: CARRIERS[parseInt(digits.slice(0, 4)) % CARRIERS.length],
        circle: CIRCLES[parseInt(digits.slice(0, 4)) % CIRCLES.length]
      };
    }

    // --- Main Single-File Application Component ---
    function ScamShieldApp() {
      const [activeTab, setActiveTab] = useState('home');
      const [searchQuery, setSearchQuery] = useState('9876543210');
      const [searchResult, setSearchResult] = useState(INITIAL_RECORDS[0]);
      const [isScanning, setIsScanning] = useState(false);
      const [searchError, setSearchError] = useState('');
      const [records, setRecords] = useState(() => {
        try {
          const s = localStorage.getItem('scamshield_records');
          return s ? JSON.parse(s) : INITIAL_RECORDS;
        } catch(e) { return INITIAL_RECORDS; }
      });
      const [showDraftModal, setShowDraftModal] = useState(false);
      const [showQuizModal, setShowQuizModal] = useState(false);

      // Report form state
      const [reportPhone, setReportPhone] = useState('');
      const [reportCat, setReportCat] = useState('Digital Arrest / Police Impersonation');
      const [reportCaller, setReportCaller] = useState('');
      const [reportDesc, setReportDesc] = useState('');
      const [reportLoss, setReportLoss] = useState(false);
      const [reportSuccess, setReportSuccess] = useState(false);

      // AI Scanner state
      const [aiText, setAiText] = useState('');
      const [aiScanning, setAiScanning] = useState(false);
      const [aiResult, setAiResult] = useState(null);

      useEffect(() => {
        localStorage.setItem('scamshield_records', JSON.stringify(records));
      }, [records]);

      const handleSearch = (raw) => {
        setSearchError('');
        const val = validateIndianNumber(raw || searchQuery);
        if (!val.isValid) {
          setSearchError(val.error);
          return;
        }
        setIsScanning(true);
        setActiveTab('check');
        setTimeout(() => {
          const found = records.find(r => r.phoneNumber === val.digits);
          if (found) {
            setSearchResult(found);
          } else {
            setSearchResult({
              phoneNumber: val.digits,
              formattedNumber: val.formatted,
              carrier: val.carrier,
              circle: val.circle,
              riskScore: 12,
              riskLevel: 'SAFE',
              categoryName: 'Unrated / Clean Number',
              callerName: 'Standard Subscriber Line',
              reportCount: 0,
              monetaryLossReported: false,
              reasons: ['Zero community complaints registered.', 'Normal telecom routing.'],
              reports: []
            });
          }
          setIsScanning(false);
        }, 500);
      };

      const handleReportSubmit = (e) => {
        e.preventDefault();
        const val = validateIndianNumber(reportPhone);
        if (!val.isValid) {
          alert(val.error);
          return;
        }
        if (!reportDesc.trim() || reportDesc.length < 15) {
          alert('Please enter a description (at least 15 characters).');
          return;
        }

        const newRep = {
          reportedAt: 'Just now',
          caller: reportCaller || 'Unknown caller',
          location: val.circle,
          desc: reportDesc.trim()
        };

        const existingIdx = records.findIndex(r => r.phoneNumber === val.digits);
        if (existingIdx >= 0) {
          const cur = records[existingIdx];
          const updated = {
            ...cur,
            riskScore: Math.min(99, cur.riskScore + 12),
            riskLevel: 'CRITICAL',
            reportCount: cur.reportCount + 1,
            monetaryLossReported: cur.monetaryLossReported || reportLoss,
            reasons: [...cur.reasons, `Citizen reported: ${reportDesc.slice(0, 50)}...`],
            reports: [newRep, ...cur.reports]
          };
          const copy = [...records];
          copy[existingIdx] = updated;
          setRecords(copy);
        } else {
          const created = {
            phoneNumber: val.digits,
            formattedNumber: val.formatted,
            carrier: val.carrier,
            circle: val.circle,
            riskScore: reportLoss ? 88 : 74,
            riskLevel: 'HIGH',
            categoryName: reportCat,
            callerName: reportCaller || 'Flagged Caller',
            reportCount: 1,
            monetaryLossReported: reportLoss,
            reasons: [`Reported under ${reportCat}.`, 'Citizen incident logged.'],
            reports: [newRep]
          };
          setRecords([created, ...records]);
        }
        setReportSuccess(true);
      };

      const handleAiScan = (text) => {
        const query = text || aiText;
        if (!query.trim() || query.length < 10) {
          alert('Please paste at least 10 characters to analyze.');
          return;
        }
        setAiScanning(true);
        setTimeout(() => {
          const l = query.toLowerCase();
          let r;
          if (l.includes('cbi') || l.includes('arrest') || l.includes('police') || l.includes('fedex')) {
            r = { score: 98, level: 'CRITICAL', cat: 'Digital Arrest / Impersonation', tactics: ['Urgent Video Interrogation', 'Fabricated Police Warrants', 'Extortion Escrow'], advice: 'Disconnect immediately. Police never arrest via Skype/WhatsApp.' };
          } else if (l.includes('apk') || l.includes('yono') || l.includes('kyc')) {
            r = { score: 94, level: 'CRITICAL', cat: 'Banking APK Malware Phishing', tactics: ['Malicious .apk remote access', 'Fake Account Expiry Deadline'], advice: 'Do NOT install the .apk file. Banks only release apps on official stores.' };
          } else if (l.includes('electricity') || l.includes('power') || l.includes('9.30pm') || l.includes('bill')) {
            r = { score: 89, level: 'HIGH', cat: 'Electricity Bill Cutoff Fraud', tactics: ['Night disconnection threat', 'Fake 10-digit officer number'], advice: 'Delete SMS. DISCOMs never use personal numbers for bill notices.' };
          } else {
            r = { score: 68, level: 'SUSPICIOUS', cat: 'Suspicious Telemarketing / Task Bait', tactics: ['Unsolicited Task Offer', 'Deposit Bait'], advice: 'Never pay upfront money or enter UPI PIN to receive earnings.' };
          }
          setAiResult(r);
          setAiScanning(false);
        }, 500);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Demo Banner */}
          <div className="bg-gradient-to-r from-blue-950 via-slate-900 to-blue-950 border-b border-cyan-500/20 px-4 py-2 text-xs text-slate-300">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span className="font-semibold text-cyan-300">DEMO DEFENSE NETWORK</span>
                <span className="hidden sm:inline">• Simulated Indian Cyber Fraud Intelligence</span>
              </div>
              <a href="tel:1930" className="text-red-400 font-mono font-bold flex items-center gap-1">
                <IconPhone className="w-3.5 h-3.5" /> Helpline: 1930
              </a>
            </div>
          </div>

          {/* Navigation Bar */}
          <header className="sticky top-0 z-50 backdrop-blur-md bg-slate-950/90 border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center glow-cyan-sm">
                  <IconShield className="w-6 h-6 text-cyan-400" />
                </div>
                <div>
                  <div className="font-mono text-xl font-bold tracking-tight text-white">
                    SCAM<span className="text-cyan-400">SHIELD</span>
                  </div>
                  <div className="text-[10px] text-slate-400 font-mono">INDIA CYBER FRAUD DEFENSE</div>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-1 bg-slate-900/60 p-1 rounded-xl border border-slate-800">
                {[
                  { id: 'home', label: 'Home' },
                  { id: 'check', label: 'Check Number' },
                  { id: 'ai', label: 'AI Scanner' },
                  { id: 'report', label: 'Report Scam' },
                  { id: 'about', label: 'About & Help' }
                ].map(t => (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                      activeTab === t.id ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white glow-cyan-sm' : 'text-slate-300 hover:text-white'
                    }`}
                  >
                    {t.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2">
                <a href="tel:1930" className="px-3 py-1.5 rounded-lg bg-red-950/50 border border-red-500/40 text-red-300 text-xs font-mono font-bold flex items-center gap-1.5">
                  <IconPhone className="w-3.5 h-3.5 text-red-400" /> 1930
                </a>
                <button onClick={() => setActiveTab('report')} className="hidden sm:flex px-3.5 py-1.5 rounded-lg bg-cyan-500 text-slate-950 text-xs font-bold tracking-wide">
                  Report Fraud
                </button>
              </div>
            </div>
          </header>

          {/* Main Body Routing */}
          <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full">
            {activeTab === 'home' && (
              <div className="space-y-16 py-6">
                {/* Hero */}
                <div className="text-center max-w-3xl mx-auto space-y-6">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-cyan-500/30 text-xs font-mono text-cyan-300 glow-cyan-sm">
                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                    <span>NATIONAL TELECOM SCANNER • +91 COMPLIANT</span>
                  </div>
                  <h1 className="text-4xl sm:text-6xl font-extrabold text-white tracking-tight leading-tight">
                    Neutralize Phone Scams <br />
                    <span className="bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-300 bg-clip-text text-transparent">
                      Before You Pick Up.
                    </span>
                  </h1>
                  <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                    Instant algorithmic threat assessment for Indian citizens. Detect fake CBI digital arrest video calls, deceptive SBI KYC alerts, and electricity cutoff notices.
                  </p>

                  {/* Search box */}
                  <div className="glass-panel-cyan p-2.5 rounded-2xl shadow-2xl max-w-xl mx-auto flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                    <div className="flex items-center pl-3 pr-2 text-slate-300 font-mono font-semibold text-sm border-r border-slate-700">
                      <span className="text-cyan-400 mr-2"><IconPhone /></span>
                      <span>+91</span>
                    </div>
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      placeholder="Enter 10-digit number (e.g. 98765 43210)"
                      className="flex-1 bg-transparent px-3 py-2 text-white font-mono text-base focus:outline-none"
                    />
                    <button
                      onClick={() => handleSearch(searchQuery)}
                      className="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-sm tracking-wide glow-cyan-sm flex items-center justify-center gap-2"
                    >
                      <IconSearch /> Check Number
                    </button>
                  </div>
                  {searchError && <div className="text-xs text-red-400">{searchError}</div>}

                  {/* Presets */}
                  <div className="flex flex-wrap items-center justify-center gap-2 text-xs pt-2">
                    <span className="text-slate-400 font-mono">Try Samples:</span>
                    {PRESETS.map(p => (
                      <button
                        key={p.num}
                        onClick={() => { setSearchQuery(p.num); handleSearch(p.num); }}
                        className="px-2.5 py-1 rounded bg-slate-900 border border-slate-800 hover:border-cyan-400 text-slate-300 text-xs font-mono"
                      >
                        {p.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Telemetry Stats */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 py-8 border-y border-slate-800">
                  <div className="glass-panel p-5 rounded-xl text-center">
                    <div className="text-2xl sm:text-3xl font-extrabold text-cyan-400 font-mono">14,820+</div>
                    <div className="text-xs text-slate-300 mt-1">Numbers Cataloged</div>
                  </div>
                  <div className="glass-panel p-5 rounded-xl text-center">
                    <div className="text-2xl sm:text-3xl font-extrabold text-emerald-400 font-mono">₹3.8 Cr+</div>
                    <div className="text-xs text-slate-300 mt-1">Loss Prevented</div>
                  </div>
                  <div className="glass-panel p-5 rounded-xl text-center">
                    <div className="text-2xl sm:text-3xl font-extrabold text-blue-400 font-mono">48,930+</div>
                    <div className="text-xs text-slate-300 mt-1">Citizen Reports</div>
                  </div>
                  <div className="glass-panel p-5 rounded-xl text-center">
                    <div className="text-2xl sm:text-3xl font-extrabold text-indigo-400 font-mono">0.4s</div>
                    <div className="text-xs text-slate-300 mt-1">Assessment Latency</div>
                  </div>
                </div>

                {/* 3 Step Workflow */}
                <div className="space-y-6">
                  <h2 className="text-2xl font-bold text-white text-center">How ScamShield Protects You in 3 Steps</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="glass-panel p-6 rounded-2xl space-y-2">
                      <div className="text-cyan-400 font-mono font-bold text-xl">01</div>
                      <h3 className="font-bold text-white">Parse Telecom Routing</h3>
                      <p className="text-xs text-slate-400 leading-relaxed">Enter any 10-digit number. ScamShield infers the circle (e.g. Delhi, Maharashtra) and matches against reported spam blasts.</p>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl space-y-2">
                      <div className="text-cyan-400 font-mono font-bold text-xl">02</div>
                      <h3 className="font-bold text-white">Algorithmic Risk Scoring</h3>
                      <p className="text-xs text-slate-400 leading-relaxed">Calculates multi-factor score (0-100) based on citizen complaints, loss reports, and imposter scripts.</p>
                    </div>
                    <div className="glass-panel p-6 rounded-2xl space-y-2">
                      <div className="text-cyan-400 font-mono font-bold text-xl">03</div>
                      <h3 className="font-bold text-white">Community Defense & 1930 Draft</h3>
                      <p className="text-xs text-slate-400 leading-relaxed">Review exact reasons behind the threat. Generate an official police complaint draft with 1-click copy.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Check Number Tab */}
            {activeTab === 'check' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="glass-panel-cyan p-4 rounded-2xl flex flex-col sm:flex-row gap-2">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Enter 10-digit Indian phone number..."
                    className="flex-1 bg-transparent px-3 py-2 text-white font-mono text-base focus:outline-none"
                  />
                  <button
                    onClick={() => handleSearch(searchQuery)}
                    className="px-6 py-2.5 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs uppercase tracking-wider glow-cyan-sm"
                  >
                    Verify Risk
                  </button>
                </div>

                {isScanning ? (
                  <div className="text-center py-16 space-y-4">
                    <div className="relative w-48 h-48 mx-auto rounded-full border border-cyan-500/30 flex items-center justify-center glow-cyan overflow-hidden">
                      <div className="absolute inset-0 rounded-full animate-radar origin-center" style={{ background: 'conic-gradient(from 0deg, rgba(0, 240, 255, 0.4) 0deg, transparent 60deg)' }}></div>
                      <IconShield className="w-12 h-12 text-cyan-400 animate-pulse" />
                    </div>
                    <div className="text-cyan-300 font-mono text-xs">QUERYING NATIONAL TELEMETRY: +91 {searchQuery}</div>
                  </div>
                ) : searchResult && (
                  <div className="glass-panel p-6 sm:p-8 rounded-2xl space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between gap-4 pb-4 border-b border-slate-800">
                      <div>
                        <div className="text-2xl sm:text-3xl font-extrabold font-mono text-white">{searchResult.formattedNumber}</div>
                        <div className="text-xs text-slate-400 font-mono mt-1">{searchResult.carrier} • {searchResult.circle}</div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => setShowDraftModal(true)} className="px-3 py-2 rounded-lg bg-blue-950/60 border border-blue-500/40 text-blue-200 text-xs font-semibold flex items-center gap-1.5">
                          <IconFile /> Police/1930 Draft
                        </button>
                        <button onClick={() => { navigator.clipboard.writeText(`Warning: Number ${searchResult.formattedNumber} is rated ${searchResult.riskScore}/100 (${searchResult.riskLevel}) on ScamShield.`); alert('Copied warning!'); }} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 text-xs flex items-center gap-1.5">
                          <IconCopy /> Share
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                      <div className="md:col-span-4 p-6 rounded-xl bg-slate-950/60 border border-slate-800 text-center space-y-2">
                        <div className="text-xs font-mono text-slate-400 uppercase">Risk Index</div>
                        <div className={`text-5xl font-extrabold font-mono ${searchResult.riskScore >= 75 ? 'text-red-400' : searchResult.riskScore >= 50 ? 'text-amber-400' : 'text-emerald-400'}`}>
                          {searchResult.riskScore}
                        </div>
                        <div className="text-xs font-bold font-mono tracking-wider uppercase text-cyan-300">{searchResult.riskLevel}</div>
                      </div>

                      <div className="md:col-span-8 space-y-3">
                        <div className="text-xs font-mono text-cyan-400 uppercase">Category</div>
                        <h3 className="text-xl font-bold text-white">{searchResult.categoryName}</h3>
                        <p className="text-xs text-slate-400">Caller Identity: <strong className="text-slate-200">{searchResult.callerName}</strong></p>
                        
                        <div className="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800 space-y-1.5">
                          <div className="text-xs font-mono font-bold text-slate-300 uppercase">Why This Score?</div>
                          {searchResult.reasons.map((r, i) => (
                            <div key={i} className="text-xs text-slate-300 flex items-start gap-2">
                              <span className="text-red-400">•</span> <span>{r}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Reports List */}
                    <div className="pt-4 border-t border-slate-800 space-y-3">
                      <div className="text-sm font-bold text-white">Community Incident Reports ({searchResult.reports.length})</div>
                      {searchResult.reports.length > 0 ? (
                        searchResult.reports.map((rep, idx) => (
                          <div key={idx} className="p-3 rounded-lg bg-slate-900/50 border border-slate-800 text-xs space-y-1">
                            <div className="flex justify-between text-slate-400 font-mono">
                              <span className="text-white font-bold">{rep.caller}</span>
                              <span>{rep.reportedAt}</span>
                            </div>
                            <p className="text-slate-300 font-sans">"{rep.desc}"</p>
                          </div>
                        ))
                      ) : (
                        <div className="text-xs text-slate-400 py-3">No citizen incident reports logged for this number.</div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* AI Message Scanner Tab */}
            {activeTab === 'ai' && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="text-center space-y-2">
                  <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900 border border-cyan-500/30 text-xs font-mono text-cyan-300">
                    <IconBot /> GEMINI AI SCAM ANALYZER
                  </div>
                  <h2 className="text-3xl font-bold text-white">Scan Suspicious SMS & WhatsApp Messages</h2>
                  <p className="text-xs sm:text-sm text-slate-300">Paste any suspicious message to detect psychological manipulation, urgent extortion, and malware APKs.</p>
                </div>

                <div className="glass-panel p-6 rounded-2xl space-y-4">
                  <div className="flex flex-wrap gap-2 text-xs">
                    <button onClick={() => { setAiText('Dear customer your electricity bill is unpaid. Power cut at 9:30pm tonight. Call 8899011223.'); handleAiScan('Dear customer your electricity bill is unpaid. Power cut at 9:30pm tonight. Call 8899011223.'); }} className="px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-slate-300 font-mono">Power Cut SMS</button>
                    <button onClick={() => { setAiText('SBI YONO blocked! Download bit.ly/sbi.apk to update PAN immediately.'); handleAiScan('SBI YONO blocked! Download bit.ly/sbi.apk to update PAN immediately.'); }} className="px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-slate-300 font-mono">SBI KYC APK</button>
                    <button onClick={() => { setAiText('Inspector Rathore CBI: Your FedEx parcel has MDMA. Stay on video call for digital arrest.'); handleAiScan('Inspector Rathore CBI: Your FedEx parcel has MDMA. Stay on video call for digital arrest.'); }} className="px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-slate-300 font-mono">CBI Digital Arrest</button>
                  </div>

                  <textarea
                    rows={4}
                    value={aiText}
                    onChange={e => setAiText(e.target.value)}
                    placeholder="Paste SMS text, WhatsApp message, or caller statement here..."
                    className="w-full bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-sm text-white focus:outline-none focus:border-cyan-400"
                  />

                  <button
                    onClick={() => handleAiScan()}
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-xs uppercase tracking-wider glow-cyan-sm flex items-center justify-center gap-2"
                  >
                    <IconBot /> {aiScanning ? 'Scanning with Gemini AI...' : 'Analyze with Gemini AI'}
                  </button>
                </div>

                {aiResult && (
                  <div className="glass-panel p-6 rounded-2xl border border-cyan-500/30 space-y-4">
                    <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                      <div>
                        <div className="text-xs font-mono text-cyan-400 uppercase">Detection Result</div>
                        <h4 className="text-xl font-bold text-white">{aiResult.cat}</h4>
                      </div>
                      <div className="text-xl font-mono font-bold text-red-400">{aiResult.score}/100 {aiResult.level}</div>
                    </div>
                    <div>
                      <div className="text-xs font-mono text-slate-400 mb-1">Deceptive Tactics Detected:</div>
                      <div className="flex flex-wrap gap-2">
                        {aiResult.tactics.map((t, idx) => (
                          <span key={idx} className="px-2.5 py-1 rounded bg-red-950/40 border border-red-500/30 text-xs font-mono text-red-300">{t}</span>
                        ))}
                      </div>
                    </div>
                    <div className="p-3.5 rounded-xl bg-blue-950/40 border border-blue-500/30 text-xs text-white leading-relaxed">
                      <strong>Immediate Citizen Rule:</strong> {aiResult.advice}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Report Scam Tab */}
            {activeTab === 'report' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="text-center space-y-2">
                  <h2 className="text-3xl font-bold text-white">Report a Fraudulent Phone Call</h2>
                  <p className="text-xs sm:text-sm text-slate-300">Your report immediately alerts fellow Indian citizens and updates risk scores.</p>
                </div>

                {reportSuccess ? (
                  <div className="glass-panel p-8 rounded-2xl text-center space-y-4 border border-emerald-500/40">
                    <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto">
                      <IconCheck className="w-6 h-6" />
                    </div>
                    <h3 className="text-xl font-bold text-white">Report Registered Successfully</h3>
                    <p className="text-xs text-slate-300">Thank you for protecting fellow citizens. The threat grid has been updated.</p>
                    <button onClick={() => { setReportSuccess(false); setActiveTab('check'); handleSearch(reportPhone); }} className="px-5 py-2.5 rounded-xl bg-cyan-500 text-slate-950 text-xs font-bold">
                      View Updated Score for this Number
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleReportSubmit} className="glass-panel p-6 rounded-2xl space-y-4">
                    <div>
                      <label className="block text-xs font-mono text-slate-300 uppercase mb-1">Suspicious Number (+91)</label>
                      <input
                        type="text"
                        value={reportPhone}
                        onChange={e => setReportPhone(e.target.value)}
                        placeholder="98765 43210"
                        className="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white font-mono text-sm focus:outline-none focus:border-cyan-400"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-mono text-slate-300 uppercase mb-1">Scam Category</label>
                      <select
                        value={reportCat}
                        onChange={e => setReportCat(e.target.value)}
                        className="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white text-sm focus:outline-none"
                      >
                        <option>Digital Arrest / Police Impersonation</option>
                        <option>Fake Bank KYC / Account Expiry</option>
                        <option>Electricity Bill Cutoff Threat</option>
                        <option>Work From Home / Telegram Task Fraud</option>
                        <option>OTP & UPI Refund Fraud</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-mono text-slate-300 uppercase mb-1">Caller Claimed Identity</label>
                      <input
                        type="text"
                        value={reportCaller}
                        onChange={e => setReportCaller(e.target.value)}
                        placeholder="e.g. CBI Officer / SBI Support"
                        className="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white text-sm focus:outline-none"
                      />
                    </div>
                    <div className="flex items-center gap-2 pt-1">
                      <input type="checkbox" id="loss" checked={reportLoss} onChange={e => setReportLoss(e.target.checked)} className="w-4 h-4 rounded" />
                      <label htmlFor="loss" className="text-xs text-red-300 font-mono">Financial loss occurred during this call</label>
                    </div>
                    <div>
                      <label className="block text-xs font-mono text-slate-300 uppercase mb-1">Incident Description</label>
                      <textarea
                        rows={3}
                        value={reportDesc}
                        onChange={e => setReportDesc(e.target.value)}
                        placeholder="Describe what the caller said or asked for..."
                        className="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white text-sm focus:outline-none focus:border-cyan-400"
                        required
                      />
                    </div>
                    <button type="submit" className="w-full py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs uppercase tracking-wider glow-red">
                      Submit Incident Report
                    </button>
                  </form>
                )}
              </div>
            )}

            {/* About Tab */}
            {activeTab === 'about' && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="text-center space-y-2">
                  <h2 className="text-3xl font-bold text-white">About ScamShield India</h2>
                  <p className="text-xs sm:text-sm text-slate-300">Empowering Indian citizens with proactive telephone intelligence and 1930 Helpline integration.</p>
                </div>

                <div className="glass-panel p-6 rounded-2xl space-y-3">
                  <h3 className="font-bold text-white text-lg">Universal Scam Red Flags</h3>
                  <div className="space-y-2 text-xs text-slate-300">
                    <p>• <strong>Video Call Arrest:</strong> Police, CBI, and courts NEVER conduct arrests over Skype or WhatsApp.</p>
                    <p>• <strong>Electricity Disconnection at 9:30 PM:</strong> DISCOMs never use 10-digit mobile numbers for bill reminders.</p>
                    <p>• <strong>UPI PIN:</strong> You NEVER enter a UPI PIN to receive money, only to send it.</p>
                    <p>• <strong>APK Files:</strong> Never install apps sent via WhatsApp. Official banks only release apps on Google Play Store.</p>
                  </div>
                </div>

                <div className="p-6 rounded-2xl bg-red-950/40 border border-red-500/40 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div>
                    <div className="font-bold text-white text-lg">Lost Money? Call 1930</div>
                    <p className="text-xs text-slate-300">National Cyber Crime Reporting Helpline operating under Ministry of Home Affairs.</p>
                  </div>
                  <a href="tel:1930" className="px-6 py-2.5 rounded-xl bg-red-600 text-white font-mono font-bold text-sm tracking-wider glow-red">
                    Call 1930
                  </a>
                </div>
              </div>
            )}
          </main>

          {/* Police Complaint Draft Modal */}
          {showDraftModal && searchResult && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-panel w-full max-w-xl rounded-2xl p-6 border border-cyan-500/40 space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <div className="font-bold text-white text-base">Cybercrime 1930 Police Complaint Draft</div>
                  <button onClick={() => setShowDraftModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="p-3.5 rounded-xl bg-slate-950 font-mono text-xs text-slate-300 max-h-64 overflow-y-auto whitespace-pre-wrap leading-relaxed select-all">
{`INCIDENT NARRATIVE DRAFT FOR CYBERCRIME.GOV.IN / 1930
Suspect Phone Number: ${searchResult.formattedNumber}
Operator / Circle: ${searchResult.carrier} (${searchResult.circle})
Impersonation Claimed: ${searchResult.callerName}
Scam Category: ${searchResult.categoryName}
Threat Index: ${searchResult.riskScore}/100 (${searchResult.riskLevel})

Summary:
${searchResult.reasons.join('\n')}

Action Requested:
Kindly trace Call Detail Records (CDR) and IPDR under Section 66D of the IT Act (Cheating by personation) and freeze linked UPI/mule bank accounts.`}
                </div>
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(`Suspect Phone Number: ${searchResult.formattedNumber}\nCategory: ${searchResult.categoryName}\nThreat Score: ${searchResult.riskScore}/100\nReasons:\n${searchResult.reasons.join('\n')}`);
                      alert('Copied complaint narrative to clipboard!');
                    }}
                    className="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs uppercase"
                  >
                    Copy Complaint
                  </button>
                  <button onClick={() => setShowDraftModal(false)} className="px-4 py-2 rounded-xl bg-slate-900 text-slate-300 text-xs">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-slate-950/80 text-slate-400 text-xs py-8 mt-12">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>© 2026 ScamShield India • Cybersecurity Citizen Network</div>
              <div className="flex gap-4">
                <a href="https://cybercrime.gov.in" target="_blank" className="hover:text-cyan-400 underline">cybercrime.gov.in</a>
                <a href="tel:1930" className="text-red-400 font-bold">1930 Helpline</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ScamShieldApp />);
  </script>
</body>
</html>
